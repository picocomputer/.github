# Publishes the web players that a repository's markdown asks for to its
# GitHub Pages site. A repository calls it with:
#
#   jobs:
#     web:
#       uses: picocomputer/.github/.github/workflows/web.yml@main
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#
# A caller can forward workflow_dispatch inputs as source and emulator;
# an empty value is the default. web/web.py describes the markdown, and so
# does https://picocomputer.github.io/web.html.

name: Web players

on:
  workflow_call:
    inputs:
      source:
        description: branch, tag or commit of the calling repository to build; empty is the pushed commit
        type: string
        default: ''
      emulator:
        description: web zip for every rp6502_web(), as EMULATOR takes it; empty is the one in CMakeLists.txt
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tip: ${{ steps.tip.outputs.tip }}
    steps:
      # checkout takes a commit only as the full hash.
      - name: Resolve the source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE" --jq .sha) || {
              echo "::error::$GITHUB_REPOSITORY has no branch, tag or commit named $SOURCE"
              exit 1
            }
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      # Callers use this workflow from main, so web.py comes from main too.
      - uses: actions/checkout@v7
        with:
          repository: picocomputer/.github
          path: .rp6502-web

      - name: Build the players
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EMULATOR: ${{ inputs.emulator }}
        run: >-
          python3 .rp6502-web/web/web.py --ci --emulator "$EMULATOR"
          --out "$RUNNER_TEMP/site"

      # Runs for separate commits overlap, so a run deploys only while the
      # branch is still at its commit, and an older run never replaces a
      # newer site.
      - name: Check that the branch is still at this commit
        id: tip
        run: |
          set -euo pipefail
          tip=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deployed: $GITHUB_REF moved past $GITHUB_SHA during the run"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.outputs.tip == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
